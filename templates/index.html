    <style>

        textarea { flex: 1; background-color: #252526; color: #9cdcfe; border: 1px solid #333; padding: 15px; font-family: 'Consolas', monospace; font-size: 14px; border-radius: 6px; resize: none; }

        button.run-btn { background-color: #0e639c; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button.run-btn:hover { background-color: #1177bb; }
        label { margin-bottom: 5px; font-weight: bold; color: #9cdcfe; }
    </style>
</head>
<body>
    <h2>🚀 C++ Gerçek Zamanlı Bulut Derleyici & Terminal</h2>
    <div class="container">
        <div class="pane">
            <label>C++ Kaynak Kodu & Hazır Projeler:</label>
            <div class="toolbar">
                <button class="preset-btn" onclick="loadCode('banka')">🏦 Bankamatik</button>

                <button class="preset-btn" onclick="loadCode('hesap')">🧮 Hesap Makinesi</button>
            </div>
            <textarea id="codeArea"></textarea>
            <button class="run-btn" onclick="runCode()">Kodu Derle ve Çalıştır</button>
        </div>
        
        <div class="pane">
            <label>İnteraktif Terminal (Girdi / Çıktı):</label>

    </div>

        };

        document.getElementById('codeArea').value = codes.banka;

        function loadCode(type) {
            document.getElementById('codeArea').value = codes[type];
        }

        let term = null;
        let socket = null;
        let inputBuffer = ""; // Kullanıcının yazdığı metni geçici tutan tampon

        function initTerminal() {
            const container = document.getElementById('terminal-container');
            if (term) {
                term.dispose();
            }
            container.innerHTML = "";

            term = new Terminal({
                cursorBlink: true,
                theme: { background: '#111111', foreground: '#d4d4d4' },
                fontFamily: 'Consolas, monospace',
                fontSize: 14
            });
            term.open(container);
            term.writeln("Terminal hazir. Soldan proje seçip derleyebilirsiniz.\x1b[0m");

            if (!socket) {
                socket = io();
                socket.on('output', function(data) {
                    if (term) {
                        term.write(data);
                    }
                });
            }

            inputBuffer = "";

            // Satır Tamponlama (Line Buffering) Mantığı
            term.onData(function(data) {
                if (data === '\r' || data === '\n') {
                    term.write('\r\n');
                    socket.emit('client_input', inputBuffer + '\n');
                    inputBuffer = ""; // Enter'a basılınca tamponu sıfırla ve sunucuya gönder
                } 
                else if (data === '\u007f' || data === '\b') {
                    // Backspace tuşuna basıldığında sadece yerel tampondan ve ekrandan sil, sunucuya gönderme!
                    if (inputBuffer.length > 0) {
                        inputBuffer = inputBuffer.slice(0, -1);
                        term.write('\b \b');
                    }
                } 
                else {
                    inputBuffer += data;
                    term.write(data); // Karakteri ekranda göster ve tampona ekle
                }
            });
        }

        initTerminal();

        function runCode() {
            initTerminal();
            const code = document.getElementById('codeArea').value;
            socket.emit('run_code', { code: code });
        }
    </script>
</body>
</html>
