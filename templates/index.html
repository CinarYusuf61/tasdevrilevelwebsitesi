 function loadCode(type) {
 document.getElementById('codeArea').value = codes[type];
 }

 let term = null;
 let socket = null;
 let inputBuffer = "";

 function initTerminal() {
 const container = document.getElementById('terminal-container');
 if (term) {
 term.dispose();
 }
 container.innerHTML = "";

 term = new Terminal({
 cursorBlink: true,
 theme: { background: '#111111', foreground: '#d4d4d4' },
 fontFamily: 'Consolas, monospace',
 fontSize: 14
 });
 term.open(container);
 term.writeln("Terminal hazir. Soldan proje seçip derleyebilirsiniz.\x1b[0m");

 if (!socket) {
 socket = io();
 socket.on('output', function(data) {
 if (term) {
 term.write(data);
 }
 });
 }

 inputBuffer = "";

 term.onData(function(data) {
 if (data === '\r' || data === '\n') {
 term.write('\r\n');
 socket.emit('client_input', inputBuffer + '\n');
 inputBuffer = "";
 } 
 else if (data === '\u007f' || data === '\b') {
 if (inputBuffer.length > 0) {
 inputBuffer = inputBuffer.slice(0, -1);
 term.write('\b \b');
 }
 } 
 else {
 inputBuffer += data;
 term.write(data);
 }
 });
 }

 initTerminal();

 function runCode() {
 initTerminal();
 const code = document.getElementById('codeArea').value;
 socket.emit('run_code', { code: code });
 }
